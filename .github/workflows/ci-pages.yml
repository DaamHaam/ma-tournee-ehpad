name: Vérifications et GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bmad-cy/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: bmad-cy

      - name: Lancer les tests unitaires
        run: npm test
        working-directory: bmad-cy

      - name: Vérifier le code
        run: npm run lint
        working-directory: bmad-cy

      - name: Compiler l'application
        run: npm run build
        working-directory: bmad-cy

      # Les paquets système (apt) passent d'abord, sans coupure : un apt interrompu laisserait un verrou et ferait échouer les essais suivants.
      - name: Installer les dépendances système des navigateurs
        run: npx playwright install-deps webkit chromium
        working-directory: bmad-cy
        timeout-minutes: 10

      # Habituellement moins d'une minute, mais l'installation se bloque parfois chez GitHub :
      # chaque essai est coupé au bout de 4 minutes et relancé, trois fois au plus.
      - name: Installer les navigateurs Playwright
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install webkit chromium && exit 0
            echo "Installation des navigateurs bloquée ou échouée (essai $attempt), nouvel essai."
          done
          exit 1
        working-directory: bmad-cy
        timeout-minutes: 14

      - name: Vérifier les parcours de production
        run: npm run test:e2e
        working-directory: bmad-cy

      - name: Préparer l'artefact GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: bmad-cy/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

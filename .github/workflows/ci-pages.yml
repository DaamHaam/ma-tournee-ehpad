name: Vérifications et GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bmad-cy/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: bmad-cy

      - name: Lancer les tests unitaires
        run: npm test
        working-directory: bmad-cy

      - name: Vérifier le code
        run: npm run lint
        working-directory: bmad-cy

      - name: Compiler l'application
        run: npm run build
        working-directory: bmad-cy

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps webkit chromium
        working-directory: bmad-cy

      - name: Vérifier les parcours de production
        run: npm run test:e2e
        working-directory: bmad-cy

      - name: Préparer l'artefact GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: bmad-cy/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
